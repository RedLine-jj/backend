server:
  port: 8081

spring:
  application:
    name: redline

  profiles:
    active: local

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:redline}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:redline}
    password: ${DB_PASSWORD:redline}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      show-sql: false
      properties:
        hibernate:
          format_sql: true
          default_batch_fetch_size: 100

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

cors:
  allowed-origins: ${CORS_ORIGINS:*}

logging:
  level:
    root: INFO
    com.jj.redline: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000
  refresh-token-expiration: 604800000

llm:
  api-key: ${GROQ_API_KEY:}
  model: llama-3.3-70b-versatile
  base-url: https://api.groq.com/openai/v1/chat/completions
---
# 자동 스케줄러 서버로 실행하기 위한 프로필
spring:
  config:
    activate:
      on-profile: scheduler
batch:
  run:
    modeman: false # 수동 실행 방지

---
# 수동으로 배치 잡을 한 번만 실행하기 위한 프로필
spring:
  config:
    activate:
      on-profile: manual-batch
  main:
    web-application-type: none # 웹 서버 비활성화
batch:
  run:
    modeman: true # 수동 실행 활성화
