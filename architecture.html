<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redline 시스템 아키텍처</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080b10;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:24px}
.w{max-width:1260px;width:100%}
svg{width:100%;height:auto;display:block}
@keyframes f{to{stroke-dashoffset:-16}}
.fl{stroke-dasharray:8 8;animation:f 1.5s linear infinite}
.bidir{stroke-dasharray:none}
</style>
</head>
<body>
<div class="w">
<svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg"
     font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Segoe UI',sans-serif">
<defs>
  <marker id="ae" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="9" markerHeight="7" orient="auto">
    <path d="M0,0 L10,3 L0,6Z" fill="#4a5568"/>
  </marker>
  <marker id="as" viewBox="0 0 10 6" refX="0" refY="3" markerWidth="9" markerHeight="7" orient="auto">
    <path d="M10,0 L0,3 L10,6Z" fill="#4a5568"/>
  </marker>
  <filter id="go" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#fb923c" flood-opacity="0.3"/></filter>
  <filter id="gc" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#22d3ee" flood-opacity="0.3"/></filter>
  <filter id="gg" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#34d399" flood-opacity="0.3"/></filter>
  <filter id="gr" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#f87171" flood-opacity="0.3"/></filter>
  <filter id="gi" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#818cf8" flood-opacity="0.3"/></filter>
  <filter id="gp" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#c084fc" flood-opacity="0.3"/></filter>
  <filter id="gb" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#60a5fa" flood-opacity="0.3"/></filter>
  <filter id="gy" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#fbbf24" flood-opacity="0.3"/></filter>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="0.5" fill="rgba(255,255,255,0.035)"/>
  </pattern>
</defs>

<!-- Background -->
<rect width="1200" height="750" fill="#0d1117"/>
<rect width="1200" height="750" fill="url(#dots)"/>

<!-- Title -->
<text x="600" y="36" text-anchor="middle" fill="#e6edf3" font-size="22" font-weight="700" letter-spacing="3">
  Redline 시스템 아키텍처
</text>
<text x="600" y="56" text-anchor="middle" fill="#484f58" font-size="10" letter-spacing="1"
      font-family="'SF Mono','Fira Code','Consolas',monospace">
  Spring Boot · MySQL · Redis · Vite · WebSocket
</text>

<!-- Layer column labels -->
<text x="130" y="82" text-anchor="middle" fill="#30363d" font-size="9" font-weight="700" letter-spacing="2"
      font-family="'SF Mono','Consolas',monospace">EXTERNAL</text>
<text x="350" y="82" text-anchor="middle" fill="#30363d" font-size="9" font-weight="700" letter-spacing="2"
      font-family="'SF Mono','Consolas',monospace">PROCESSING</text>
<text x="570" y="82" text-anchor="middle" fill="#30363d" font-size="9" font-weight="700" letter-spacing="2"
      font-family="'SF Mono','Consolas',monospace">STORAGE</text>
<text x="790" y="82" text-anchor="middle" fill="#30363d" font-size="9" font-weight="700" letter-spacing="2"
      font-family="'SF Mono','Consolas',monospace">SERVICES</text>
<text x="1020" y="82" text-anchor="middle" fill="#30363d" font-size="9" font-weight="700" letter-spacing="2"
      font-family="'SF Mono','Consolas',monospace">CLIENT</text>

<!-- ====== ARROWS (behind boxes) ====== -->

<!-- 사이트1 → Batch -->
<path d="M205,158 C235,158 245,275 275,275" fill="none" stroke="#3d444d" stroke-width="1.5" class="fl" marker-end="url(#ae)"/>
<!-- 사이트2 → Batch -->
<path d="M205,295 L275,295" fill="none" stroke="#3d444d" stroke-width="1.5" class="fl" marker-end="url(#ae)"/>
<!-- 사이트3 → Batch -->
<path d="M205,430 C235,430 245,315 275,315" fill="none" stroke="#3d444d" stroke-width="1.5" class="fl" marker-end="url(#ae)"/>
<!-- Label -->
<text x="240" y="292" text-anchor="middle" fill="#6e7681" font-size="9"
      stroke="#0d1117" stroke-width="4" paint-order="stroke">HTTP 크롤링</text>

<!-- Batch → MySQL -->
<path d="M425,278 C455,278 465,218 495,218" fill="none" stroke="#3d444d" stroke-width="1.5" class="fl" marker-end="url(#ae)"/>
<text x="460" y="242" text-anchor="middle" fill="#6e7681" font-size="9"
      stroke="#0d1117" stroke-width="4" paint-order="stroke">데이터 저장</text>

<!-- Batch → Redis -->
<path d="M425,312 C455,312 465,405 495,405" fill="none" stroke="#3d444d" stroke-width="1.5" class="fl" marker-end="url(#ae)"/>
<text x="460" y="365" text-anchor="middle" fill="#6e7681" font-size="9"
      stroke="#0d1117" stroke-width="4" paint-order="stroke">상태 저장/비교</text>

<!-- Batch → WS (routed below Redis) -->
<path d="M350,336 L350,520 L790,520 L790,456" fill="none" stroke="#3d444d" stroke-width="1.5" class="fl" marker-end="url(#ae)"/>
<text x="570" y="514" text-anchor="middle" fill="#6e7681" font-size="9"
      stroke="#0d1117" stroke-width="4" paint-order="stroke">변경 감지 시 push</text>

<!-- API ↔ MySQL -->
<line x1="645" y1="218" x2="715" y2="218" stroke="#3d444d" stroke-width="1.5" class="bidir" marker-start="url(#as)" marker-end="url(#ae)"/>
<text x="680" y="208" text-anchor="middle" fill="#6e7681" font-size="9"
      stroke="#0d1117" stroke-width="4" paint-order="stroke">조회</text>

<!-- API ↔ Redis -->
<path d="M645,395 C675,395 685,240 715,240" fill="none" stroke="#3d444d" stroke-width="1.5" class="bidir" marker-start="url(#as)" marker-end="url(#ae)"/>
<text x="688" y="322" text-anchor="middle" fill="#6e7681" font-size="9"
      stroke="#0d1117" stroke-width="4" paint-order="stroke">캐시/상태 조회</text>

<!-- Front ↔ API -->
<path d="M865,218 C900,218 910,280 945,280" fill="none" stroke="#3d444d" stroke-width="1.5" class="bidir" marker-start="url(#as)" marker-end="url(#ae)"/>
<text x="905" y="243" text-anchor="middle" fill="#6e7681" font-size="9"
      stroke="#0d1117" stroke-width="4" paint-order="stroke">REST API</text>

<!-- Front ↔ WS -->
<path d="M865,418 C900,418 910,318 945,318" fill="none" stroke="#3d444d" stroke-width="1.5" class="bidir" marker-start="url(#as)" marker-end="url(#ae)"/>
<text x="905" y="374" text-anchor="middle" fill="#6e7681" font-size="9"
      stroke="#0d1117" stroke-width="4" paint-order="stroke">WebSocket</text>

<!-- 사용자 → Front -->
<line x1="1020" y1="548" x2="1020" y2="340" stroke="#3d444d" stroke-width="1.5" class="fl" marker-end="url(#ae)"/>
<text x="1040" y="450" text-anchor="start" fill="#6e7681" font-size="9"
      stroke="#0d1117" stroke-width="4" paint-order="stroke">브라우저</text>

<!-- ====== GROUP BOX: 대상 사이트 ====== -->
<rect x="38" y="98" width="184" height="385" rx="12" fill="none"
      stroke="rgba(251,146,60,0.18)" stroke-width="1" stroke-dasharray="6 4"/>
<text x="130" y="112" text-anchor="middle" fill="rgba(251,146,60,0.4)" font-size="9" font-weight="600">대상 사이트</text>

<!-- ====== COMPONENT BOXES ====== -->

<!-- 대상 사이트 1 -->
<g filter="url(#go)">
  <rect x="55" y="120" width="150" height="76" rx="10" fill="#161b22" stroke="#fb923c" stroke-width="1.5"/>
  <rect x="55" y="120" width="150" height="3.5" rx="10" fill="#fb923c" opacity="0.8"/>
  <text x="130" y="148" text-anchor="middle" font-size="16">🌐</text>
  <text x="130" y="166" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="600">대상 사이트 1</text>
  <text x="130" y="182" text-anchor="middle" fill="#6e7681" font-size="9"
        font-family="'SF Mono','Consolas',monospace">Target Site 1</text>
</g>

<!-- 대상 사이트 2 -->
<g filter="url(#go)">
  <rect x="55" y="257" width="150" height="76" rx="10" fill="#161b22" stroke="#fb923c" stroke-width="1.5"/>
  <rect x="55" y="257" width="150" height="3.5" rx="10" fill="#fb923c" opacity="0.8"/>
  <text x="130" y="285" text-anchor="middle" font-size="16">🌐</text>
  <text x="130" y="303" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="600">대상 사이트 2</text>
  <text x="130" y="319" text-anchor="middle" fill="#6e7681" font-size="9"
        font-family="'SF Mono','Consolas',monospace">Target Site 2</text>
</g>

<!-- 대상 사이트 3 -->
<g filter="url(#go)">
  <rect x="55" y="392" width="150" height="76" rx="10" fill="#161b22" stroke="#fb923c" stroke-width="1.5"/>
  <rect x="55" y="392" width="150" height="3.5" rx="10" fill="#fb923c" opacity="0.8"/>
  <text x="130" y="420" text-anchor="middle" font-size="16">🌐</text>
  <text x="130" y="438" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="600">대상 사이트 3</text>
  <text x="130" y="454" text-anchor="middle" fill="#6e7681" font-size="9"
        font-family="'SF Mono','Consolas',monospace">Target Site 3</text>
</g>

<!-- Batch 서버 -->
<g filter="url(#gc)">
  <rect x="275" y="258" width="150" height="78" rx="10" fill="#161b22" stroke="#22d3ee" stroke-width="1.5"/>
  <rect x="275" y="258" width="150" height="3.5" rx="10" fill="#22d3ee" opacity="0.8"/>
  <text x="350" y="286" text-anchor="middle" font-size="16">⚙️</text>
  <text x="350" y="304" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="600">Batch 서버</text>
  <text x="350" y="320" text-anchor="middle" fill="#6e7681" font-size="9"
        font-family="'SF Mono','Consolas',monospace">크롤링 · Crawl Server</text>
</g>

<!-- MySQL -->
<g filter="url(#gg)">
  <rect x="495" y="180" width="150" height="78" rx="10" fill="#161b22" stroke="#34d399" stroke-width="1.5"/>
  <rect x="495" y="180" width="150" height="3.5" rx="10" fill="#34d399" opacity="0.8"/>
  <text x="570" y="208" text-anchor="middle" font-size="16">🗃️</text>
  <text x="570" y="226" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="600">MySQL</text>
  <text x="570" y="242" text-anchor="middle" fill="#6e7681" font-size="9"
        font-family="'SF Mono','Consolas',monospace">Main Database</text>
</g>

<!-- Redis -->
<g filter="url(#gr)">
  <rect x="495" y="368" width="150" height="78" rx="10" fill="#161b22" stroke="#f87171" stroke-width="1.5"/>
  <rect x="495" y="368" width="150" height="3.5" rx="10" fill="#f87171" opacity="0.8"/>
  <text x="570" y="396" text-anchor="middle" font-size="16">⚡</text>
  <text x="570" y="414" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="600">Redis</text>
  <text x="570" y="430" text-anchor="middle" fill="#6e7681" font-size="9"
        font-family="'SF Mono','Consolas',monospace">직전 상태값 저장</text>
</g>

<!-- API 서버 -->
<g filter="url(#gi)">
  <rect x="715" y="180" width="150" height="78" rx="10" fill="#161b22" stroke="#818cf8" stroke-width="1.5"/>
  <rect x="715" y="180" width="150" height="3.5" rx="10" fill="#818cf8" opacity="0.8"/>
  <text x="790" y="208" text-anchor="middle" font-size="16">🔌</text>
  <text x="790" y="226" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="600">API 서버</text>
  <text x="790" y="242" text-anchor="middle" fill="#6e7681" font-size="9"
        font-family="'SF Mono','Consolas',monospace">Redline Main Server</text>
</g>

<!-- WebSocket -->
<g filter="url(#gp)">
  <rect x="715" y="380" width="150" height="76" rx="10" fill="#161b22" stroke="#c084fc" stroke-width="1.5"/>
  <rect x="715" y="380" width="150" height="3.5" rx="10" fill="#c084fc" opacity="0.8"/>
  <text x="790" y="406" text-anchor="middle" font-size="16">📡</text>
  <text x="790" y="424" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="600">WebSocket</text>
  <text x="790" y="440" text-anchor="middle" fill="#6e7681" font-size="9"
        font-family="'SF Mono','Consolas',monospace">상태값 변경 알람</text>
</g>

<!-- Front 서버 -->
<g filter="url(#gb)">
  <rect x="945" y="262" width="150" height="78" rx="10" fill="#161b22" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="945" y="262" width="150" height="3.5" rx="10" fill="#60a5fa" opacity="0.8"/>
  <text x="1020" y="290" text-anchor="middle" font-size="16">💻</text>
  <text x="1020" y="308" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="600">Front 서버</text>
  <text x="1020" y="324" text-anchor="middle" fill="#6e7681" font-size="9"
        font-family="'SF Mono','Consolas',monospace">Vite Client</text>
</g>

<!-- 사용자 -->
<g filter="url(#gy)">
  <rect x="955" y="555" width="130" height="78" rx="10" fill="#161b22" stroke="#fbbf24" stroke-width="1.5"/>
  <rect x="955" y="555" width="130" height="3.5" rx="10" fill="#fbbf24" opacity="0.8"/>
  <text x="1020" y="583" text-anchor="middle" font-size="20">👤</text>
  <text x="1020" y="603" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="600">사용자</text>
  <text x="1020" y="619" text-anchor="middle" fill="#6e7681" font-size="9"
        font-family="'SF Mono','Consolas',monospace">Browser User</text>
</g>

<!-- ====== LEGEND ====== -->
<line x1="340" y1="700" x2="370" y2="700" stroke="#3d444d" stroke-width="1.5" stroke-dasharray="8 8"/>
<path d="M374,697 L380,700 L374,703Z" fill="#4a5568"/>
<text x="388" y="703" fill="#484f58" font-size="9">단방향 흐름</text>
<path d="M490,697 L484,700 L490,703Z" fill="#4a5568"/>
<line x1="494" y1="700" x2="524" y2="700" stroke="#3d444d" stroke-width="1.5"/>
<path d="M528,697 L534,700 L528,703Z" fill="#4a5568"/>
<text x="542" y="703" fill="#484f58" font-size="9">양방향 통신</text>

<!-- Layer color dots in legend -->
<circle cx="640" cy="700" r="4" fill="#fb923c"/>
<text x="650" y="703" fill="#484f58" font-size="9">External</text>
<circle cx="710" cy="700" r="4" fill="#22d3ee"/>
<text x="720" y="703" fill="#484f58" font-size="9">Processing</text>
<circle cx="800" cy="700" r="4" fill="#34d399"/>
<text x="810" y="703" fill="#484f58" font-size="9">Storage</text>
<circle cx="866" cy="700" r="4" fill="#818cf8"/>
<text x="876" y="703" fill="#484f58" font-size="9">Services</text>
<circle cx="938" cy="700" r="4" fill="#60a5fa"/>
<text x="948" y="703" fill="#484f58" font-size="9">Client</text>

<!-- Decorative subtle line above legend -->
<line x1="300" y1="680" x2="900" y2="680" stroke="rgba(48,54,61,0.4)" stroke-width="0.5"/>

</svg>
</div>
</body>
</html>
